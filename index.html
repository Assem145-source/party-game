/* التصميم: شاشة ممتدة بعرض كامل، المحتوى عمود مركزي، وحدة القياس u = ‎1/920‎ من عرض العمود */
:root{
  --bg:#ebebeb; --paper:#ffffff; --ink:#000000; --ink2:#191919;
  --mute:#939393; --field:#d7d7d7; --soft:#b5b5b5;
  --red:#cf3e3e; --red-hi:#f07373; --blue:#338fcc; --green:#3ecf8b;
  --u:calc(min(100vw,480px)/920);
  --hl:max(1px,calc(var(--u)*2.5));
  --c:#000000;
}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:'Thmanyah Sans','Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;font-weight:400;font-feature-settings:"ss01";color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{pointer-events:none}
button,input,textarea{font:inherit;color:inherit;font-feature-settings:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
em,i{font-style:normal}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
#app{position:relative;width:100%;height:100%;overflow:hidden;direction:rtl}

.screen{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;animation:in .28s ease both}
.screen.q{animation:none}
.screen.g{background:var(--bg)}
.screen.w{background:var(--paper)}
.col{width:min(100%,480px);margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(var(--u)*140)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* دوائر الأزرار */
.cbtn{flex:none;width:calc(var(--u)*150);height:calc(var(--u)*150);border-radius:50%;display:grid;place-items:center;border:var(--hl) solid var(--ink);transition:transform .15s,background .25s,border-color .25s,color .25s}
.cbtn svg{width:calc(var(--u)*52);height:calc(var(--u)*52);stroke:currentColor;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.cbtn.fill{background:var(--ink);color:#fff}
.cbtn.out{background:transparent;color:var(--ink)}
.cbtn.red{background:var(--red);border-color:var(--red);color:#fff}
.cbtn.redo{border-color:var(--red);color:var(--red)}
.act{display:flex;align-items:center;gap:calc(var(--u)*54);font-size:calc(var(--u)*27);width:fit-content;line-height:1.3}
.act:active:not(:disabled) .cbtn{transform:scale(.93)}
.act:disabled{cursor:default}
.act:disabled .cbtn{background:var(--mute);border-color:var(--mute);color:#e6e6e6}
.act:disabled em{color:var(--mute)}
.act.grn .cbtn{background:var(--green);border-color:var(--green);color:#fff}
.act.col1{flex-direction:column;gap:calc(var(--u)*22);align-self:center}
.act.rd em{color:var(--red)}
.dot{width:calc(var(--u)*20);height:calc(var(--u)*20);border-radius:50%;background:var(--c);flex:none}

/* الصور الشخصية */
.pav{background:#fff center/cover no-repeat;display:grid;place-items:center;overflow:hidden;border-radius:50%;position:relative}
.pav b{font-size:calc(var(--u)*62);font-weight:900;color:#d3d3d3;line-height:1}
.pav.has b,.pav.has svg{display:none}

/* التسجيل والدخول */
.auth{padding:calc(var(--u)*300) calc(var(--u)*62) calc(var(--u)*80);display:flex;flex-direction:column}
.big{font-size:calc(var(--u)*55);font-weight:900;line-height:calc(var(--u)*100);display:flex;align-items:center;gap:calc(var(--u)*18);padding-inline:calc(var(--u)*48)}
.big .dot{margin-top:calc(var(--u)*20)}
.sub{margin-top:calc(var(--u)*5);font-size:calc(var(--u)*34);font-weight:300;line-height:calc(var(--u)*60);padding-inline:calc(var(--u)*48)}
.lab{margin:calc(var(--u)*142) 0 calc(var(--u)*7);font-size:calc(var(--u)*34);line-height:calc(var(--u)*50);padding-inline:calc(var(--u)*48)}
.pill+.lab{margin-top:calc(var(--u)*88)}
.pill{width:100%;height:calc(var(--u)*150);border:0;border-radius:999px;background:var(--field);font-size:calc(var(--u)*38);padding:0 calc(var(--u)*64);outline:none;text-align:right}
.pill::placeholder{color:#a9a9a9}
.pill:focus-visible{outline:3px solid #000;outline-offset:3px}
.err{height:calc(var(--u)*90);display:flex;align-items:center;padding-inline:calc(var(--u)*48);color:var(--red);font-size:calc(var(--u)*26);line-height:1.3}
.auth.login .lab{margin-top:calc(var(--u)*258)}
.auth.login .err{height:calc(var(--u)*268);align-items:flex-start;padding-top:calc(var(--u)*22)}
.auth .act{margin-inline-start:calc(var(--u)*-2)}
.auth .act+.act{margin-top:calc(var(--u)*45)}
.wm{writing-mode:vertical-rl;margin-top:calc(var(--u)*106);align-self:flex-start;font-size:calc(var(--u)*36);line-height:1;padding-inline-start:calc(var(--u)*10)}
.splash{flex:1;display:grid;place-items:center}
.splash .dot{width:calc(var(--u)*30);height:calc(var(--u)*30);animation:bl 1s infinite alternate}
@keyframes bl{from{opacity:.2}to{opacity:1}}

/* الرئيسية */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--u)*150) calc(var(--u)*77) 0 calc(var(--u)*142);height:calc(var(--u)*300);flex:none}
.hi{font-size:calc(var(--u)*46);font-weight:400;display:flex;align-items:center;gap:calc(var(--u)*14);white-space:nowrap;max-width:calc(var(--u)*560)}
.hi b{font-weight:900;overflow:hidden;text-overflow:ellipsis}
.hi .dot{margin-top:calc(var(--u)*22)}
.topb{position:relative;width:calc(var(--u)*150);height:calc(var(--u)*150);flex:none}
.topb .pav{position:absolute;inset:0;border:var(--hl) solid #000;background-color:transparent}
.topb .pav b{font-size:calc(var(--u)*56);color:#000;font-weight:400}
.topb .pav.has{border-color:#000}
.live{margin:calc(var(--u)*75) calc(var(--u)*62) 0;height:calc(var(--u)*167);border-radius:999px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*58) 0 calc(var(--u)*21);flex:none;text-align:right}
.liveTx{display:flex;flex-direction:column;gap:calc(var(--u)*2);min-width:0}
.liveTx b{font-size:calc(var(--u)*45);font-weight:700;line-height:calc(var(--u)*58);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liveTx span{font-size:calc(var(--u)*34);line-height:calc(var(--u)*46)}
.liveGo{display:flex;align-items:center;gap:calc(var(--u)*22);font-size:calc(var(--u)*27);flex:none}
.liveGo .cw{width:calc(var(--u)*125);height:calc(var(--u)*125);border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.liveGo .cw svg{width:calc(var(--u)*46);height:calc(var(--u)*46);stroke:currentColor;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.cards{margin:calc(var(--u)*46) calc(var(--u)*62) 0;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*72) calc(var(--u)*28)}
.cards.nb{margin-top:calc(var(--u)*75)}
.card{height:calc(var(--u)*375);border-radius:calc(var(--u)*120);background:var(--field);color:var(--mute);font-size:calc(var(--u)*58);font-weight:900;line-height:calc(var(--u)*98);text-align:center;display:grid;place-items:center;padding:0 calc(var(--u)*20);transition:transform .15s,background .2s,color .2s}
.card.hot{background:var(--red);color:#fff}
.card:active{transform:scale(.97);background:var(--c);color:#fff}
.acts2{display:flex;flex-direction:column;gap:calc(var(--u)*38);justify-content:center;align-items:flex-start}
.acts2 .act{gap:calc(var(--u)*42)}

/* الهيكل المشترك لشاشات الألعاب */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--u)*150) calc(var(--u)*77) 0 calc(var(--u)*75);height:calc(var(--u)*300);flex:none}
.ttl{font-size:calc(var(--u)*45);font-weight:400;display:flex;align-items:center;white-space:nowrap}
.ttl .dot{width:calc(var(--u)*16);height:calc(var(--u)*16);margin:calc(var(--u)*10) calc(var(--u)*14) 0}
.ttl small{font-size:calc(var(--u)*26);color:#a5a5a5;font-weight:300}
.ttl.rm{font-weight:900}
.ttl.rm .dot{width:calc(var(--u)*36);height:calc(var(--u)*36);margin:calc(var(--u)*6) calc(var(--u)*28) 0 0;order:2;background:var(--red)}
.body{padding:calc(var(--u)*58) calc(var(--u)*63) 0;display:flex;flex-direction:column;flex:1}
.bubble{border:var(--hl) solid #000;border-radius:calc(var(--u)*110);text-align:center;font-size:calc(var(--u)*50);line-height:calc(var(--u)*76);padding:calc(var(--u)*67) calc(var(--u)*44);width:100%}
.lab.sm{margin:calc(var(--u)*2) 0 calc(var(--u)*14);padding-inline:calc(var(--u)*76);font-size:calc(var(--u)*30);line-height:calc(var(--u)*40)}
.lab.sm.second{margin-top:calc(var(--u)*26)}
.ta{display:block;height:calc(var(--u)*361);resize:none;background:transparent;border-radius:calc(var(--u)*100);outline:none;caret-color:var(--c)}
.ta:focus,.po:focus{border-color:var(--c)}
.ta::placeholder,.po::placeholder{color:#b0b0b0;font-size:.62em}
.ta:disabled,.po:disabled{color:#777}
.po{width:100%;height:calc(var(--u)*147);border:var(--hl) solid #000;border-radius:999px;background:transparent;font-size:calc(var(--u)*36);padding:0 calc(var(--u)*60);outline:none;text-align:right;caret-color:var(--c)}
.ok{margin:calc(var(--u)*44) 0 0;margin-inline-start:calc(var(--u)*43)}
.hint{margin:calc(var(--u)*24) calc(var(--u)*52) 0 0;font-size:calc(var(--u)*28);color:var(--mute)}
.hint b{font-weight:700;color:var(--c)}
.st{margin:calc(var(--u)*34) calc(var(--u)*52) 0 0;font-size:calc(var(--u)*28);color:var(--mute);line-height:1.5}

/* التصويت */
.story{min-height:calc(var(--u)*362);display:grid;place-items:center}
.tblock{margin-top:calc(var(--u)*75)}
.tpill{width:fit-content;min-width:calc(var(--u)*318);height:calc(var(--u)*117);border:var(--hl) solid #000;border-radius:999px;display:grid;place-items:center;font-size:calc(var(--u)*45);font-weight:900;padding:0 calc(var(--u)*50);font-variant-numeric:tabular-nums}

async function rtdbBackend(){
  const V='10.14.1',U='https://www.gstatic.com/firebasejs/'+V+'/';
  const to=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
  const [A,D]=await to(Promise.all([import(U+'firebase-app.js'),import(U+'firebase-database.js')]),9000);
  const app=A.initializeApp(FB),db=D.getDatabase(app);
  const R=p=>D.ref(db,p);
  const cv=v=>(v&&v.__inc!=null)?D.increment(v.__inc):((v&&v.__ts)?D.serverTimestamp():v);
  let SM=null;
  return {
    mode:'rtdb',
    async get(p){const s=await D.get(R(p));return s.val()},
    set(p,v){return D.set(R(p),cv(v))},
    update(ops){const o={};for(const k in ops)o[k]=cv(ops[k]);return D.update(D.ref(db),o)},
    remove(p){return D.remove(R(p))},
    watch(p,cb){return D.onValue(R(p),s=>cb(s.val()),()=>{})},
    offset(cb){return D.onValue(R('.info/serverTimeOffset'),s=>cb(s.val()||0))},
    presence(ph){
      const pr=R('presence/'+ph);
      const off=D.onValue(R('.info/connected'),s=>{if(s.val()===true){D.onDisconnect(pr).remove();D.set(pr,{at:D.serverTimestamp()}).catch(()=>{})}});
      const iv=setInterval(()=>{D.set(pr,{at:D.serverTimestamp()}).catch(()=>{})},20000);
      const bye=()=>{try{D.remove(pr)}catch(e){}};
      window.addEventListener('pagehide',bye);
      return ()=>{off();clearInterval(iv);bye()};
    },
    async delFile(path){if(!SM){const M=await import(U+'firebase-storage.js');SM={M,st:M.getStorage(app)}}return SM.M.deleteObject(SM.M.ref(SM.st,path))},
    async upload(path,file,onP){
      if(!SM){const M=await import(U+'firebase-storage.js');SM={M,st:M.getStorage(app)}}
      const r=SM.M.ref(SM.st,path),task=SM.M.uploadBytesResumable(r,file,{contentType:file.type});
      await new Promise((res,rej)=>task.on('state_changed',s=>onP&&onP(s.bytesTransferred/s.totalBytes),rej,res));
      return SM.M.getDownloadURL(r);
    }
  };
}

function localBackend(){
  const KEY='mjhool:tree';let memT={};
  const load=()=>{try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):{}}catch(e){return memT}};
  const save=t=>{memT=t;try{localStorage.setItem(KEY,JSON.stringify(t))}catch(e){}};
  const segs=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>{let n=t;for(const s of segs(p)){if(n==null||typeof n!=='object')return null;n=n[s]}return n===undefined?null:n};
  const setAt=(t,p,v)=>{const s=segs(p);let n=t;for(let i=0;i<s.length-1;i++){if(n[s[i]]==null||typeof n[s[i]]!=='object')n[s[i]]={};n=n[s[i]]}const k=s[s.length-1];if(v==null)delete n[k];else n[k]=v};
  const prune=o=>{if(o&&typeof o==='object'){for(const k of Object.keys(o)){prune(o[k]);const c=o[k];if(c&&typeof c==='object'&&!Object.keys(c).length)delete o[k]}}};
  const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const ws=[];
  const fire=w=>{const v=getAt(load(),w.p),j=JSON.stringify(v);if(j!==w.last){w.last=j;w.cb(clone(v))}};
  const notify=()=>ws.slice().forEach(fire);
  let ch=null;try{ch=new BroadcastChannel('mjhool-tree');ch.onmessage=notify}catch(e){}
  window.addEventListener('storage',e=>{if(e.key===KEY)notify()});
  const write=ops=>{
    const t=load();
    for(const p in ops){const v=ops[p];
      if(v&&v.__inc!=null)setAt(t,p,(getAt(t,p)||0)+v.__inc);
      else if(v&&v.__ts)setAt(t,p,Date.now());
      else setAt(t,p,clone(v));
    }
    prune(t);save(t);notify();try{ch&&ch.postMessage(1)}catch(e){}
  };
  return {
    mode:'local',
    async get(p){return clone(getAt(load(),p))},
    async set(p,v){write({[p]:v})},
    async update(ops){write(ops)},
    async remove(p){write({[p]:null})},
    watch(p,cb){const w={p,cb,last:undefined};ws.push(w);setTimeout(()=>fire(w),0);return()=>{const i=ws.indexOf(w);if(i>=0)ws.splice(i,1)}},
    offset(cb){cb(0);return()=>{}},
    presence(ph){
      const put=()=>write({['presence/'+ph]:{at:Date.now()}});put();
      const iv=setInterval(put,15000);const bye=()=>{try{write({['presence/'+ph]:null})}catch(e){}};
      window.addEventListener('pagehide',bye);
      return()=>{clearInterval(iv);bye()};
    },
    async delFile(){},
    upload(path,file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
  };
}

async function squareJpeg(file,size,q){
  const bmp=await createImageBitmap(file);
  const s=Math.min(bmp.width,bmp.height),c=document.createElement('canvas');c.width=c.height=size;
  c.getContext('2d').drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,size,size);
  return c.toDataURL('image/jpeg',q);
}
async function shrinkImage(file){
  const bmp=await createImageBitmap(file);
  for(const [max,q] of [[900,.62],[760,.52],[640,.46],[520,.4],[420,.34]]){
    const s=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);

  }

}

const phsOf=(g)=>arr(g.cands);
GAMES.story={color:COL.blue,title:'من راعي السالفة؟!',label:'من راعي السالفة',min:3,
  init:R0=>({phase:'write',cands:presentPh(R0),queue:[],i:0}),
  host(R0,g){
    const t=now(),pres=presentPh(R0);
    if(g.phase==='write'){
      const sto=g.stories||{};
      if(pres.every(ph=>sto[K(ph)])||t>g.t0+DUR.write){
        const owners=shuffle(Object.keys(sto).map(PHK));
        if(owners.length<2)return nx(g,{'g/phase':'end','g/abort':true});
        return nx(g,{'g/phase':'vote','g/queue':owners,'g/i':0,'g/cands':Array.from(new Set(pres.concat(owners)))});
      }
    }else if(g.phase==='vote'){
      const owner=arr(g.queue)[g.i],vs=((g.votes||{})['r'+g.i])||{};
      const elig=phsOf(g).filter(ph=>ph!==owner&&pres.includes(ph));
      if((elig.every(ph=>vs[K(ph)])&&t>g.t0+DUR.read)||t>g.t0+DUR.read+DUR.vote)return nx(g,{'g/phase':'reveal'});
    }else if(g.phase==='reveal'){
      if(t>g.t0+DUR.reveal)return GAMES.story.after(g);
    }
    return null;
  },
  after(g){return g.i+1<arr(g.queue).length?nx(g,{'g/phase':'vote','g/i':g.i+1}):nx(g,{'g/phase':'end'})},
  scores(g){
    const sc={};phsOf(g).forEach(ph=>sc[ph]=0);
    arr(g.queue).forEach((owner,i)=>{
      const vs=((g.votes||{})['r'+i])||{};
      Object.keys(vs).forEach(k=>{const v=PHK(k);if(vs[k]===owner)sc[v]=(sc[v]||0)+15;else sc[owner]=(sc[owner]||0)+5});
    });
    return sc;
  },
  view(R0,g){
    const T=GAMES.story.title,C=COL.blue,ph=ME.phone;let el;
    if(g.phase==='write'){
      return {bg:'w',c:C,html:hdr(T,C)+`
<div class="body">
  <label class="lab sm" for="sx">السالفة</label>
  <textarea class="bubble ta" id="sx" maxlength="140" placeholder="اكتب سالفة صارت لك فعلاً، والباقين يخمنون مين راعيها"></textarea>
  <label class="lab sm second" for="sh">تلميح</label>
  <input class="po" id="sh" maxlength="30" placeholder="كلمة وحدة تلمّح بدون ما تفضحك">
  <button class="act ok" id="go" data-act="storySend" disabled><span class="cbtn fill">${I.check}</span><em id="gl">تأكيد</em></button>
  <p class="st" id="stt"></p>
</div>`,
      mount(e){el=e;const sx=$('#sx',el);sx.addEventListener('input',()=>{$('#go',el).disabled=sx.value.trim().length<8})},
      update(R1,g1){
        const my=(g1.stories||{})[K(ph)];
        const sx=$('#sx',el),sh=$('#sh',el),go=$('#go',el);
        if(my){sx.value=my.text;sh.value=my.hint||'';sx.disabled=sh.disabled=true;go.disabled=true;$('#gl',el).textContent='تم'}
        const got=Object.keys(g1.stories||{}).length,tot=presentPh(R1).length;
        const rem=Math.max(0,Math.ceil((g1.t0+DUR.write-now())/1000));
        $('#stt',el).textContent=(my?'وصلت سالفتك. ':'')+`كتبوا ${ar(got)} من ${ar(tot)} · باقي ${ar(rem)} ثانية`;
      }};
    }
    if(g.phase==='vote'){
      const owner=arr(g.queue)[g.i],mine=owner===ph,idx='r'+g.i;
      const q=(g.stories||{})[K(owner)]||{text:'',hint:''};
      const cands=phsOf(g).filter(p=>p!==ph);
      return {bg:'w',c:C,html:hdr(T,C)+`
<div class="body vote" id="vote">
  <div class="bubble story">${esc(q.text)}</div>
  ${q.hint?`<p class="hint">تلميح: <b>${esc(q.hint)}</b></p>`:''}
  ${mine?`<p class="st" id="own"></p>`:`
  <div class="tblock"><div class="tpill" id="tv">${ar(Math.ceil(DUR.read/1000))} ثانية</div><p class="cap">باقي للتصويت</p></div>
  <h3 class="vh"><span class="lock">${I.lock}</span>صوّت</h3>
  <div class="grid">${cands.map(p=>`<button class="pl" data-act="pick" data-n="${esc(p)}">${pav(p)}<em>${esc(nm(p))}</em></button>`).join('')}</div>
  <button class="act ok" id="go" data-act="storyVote" disabled><span class="cbtn fill">${I.check}</span><em id="gl">تأكيد</em></button>`}
</div>`,
      mount(e){el=e},
      update(R1,g1){
        const vs=(g1.votes||{})[idx]||{};
        if(mine){
          const elig=phsOf(g1).filter(p=>p!==ph&&isOn(p)),done=elig.filter(p=>vs[K(p)]).length;
          $('#own',el).textContent=`هذي سالفتك! الباقين يخمنون مين راعيها. صوّتوا ${ar(done)} من ${ar(elig.length)}`;return;
        }
        const left=Math.ceil((g1.t0+DUR.read-now())/1000),box=$('#vote',el);
        if(left>0)$('#tv',el).textContent=ar(left)+' ثانية';
        else if(!box.classList.contains('open')){box.classList.add('open');beep(780,.15);buzz(40)}
        const my=vs[K(ph)];
        if(my){$$('.pl',el).forEach(b=>b.classList.toggle('on',b.dataset.n===my));$('#go',el).disabled=true;$('#gl',el).textContent='تم · ننتظر الباقين';box.classList.add('open')}
      }};
    }
    if(g.phase==='reveal'){
      const owner=arr(g.queue)[g.i],vs=((g.votes||{})['r'+g.i])||{},mine=owner===ph;
      const votes=Object.values(vs),right=votes.filter(v=>v===owner).length,mv=vs[K(ph)];
      const ok=!mine&&mv===owner;
      const host=isHost(R0);
      let r1,r2,dim='';
      if(mine){r1='سالفتك عرفوها';r2=ar(right)+' من '+ar(votes.length)}
      else if(!mv){r1='ما صوّتّ';r2='+'+ar(0)+' نقطة';dim=' dim'}
      else if(ok){r1='إجابة صحيحة';r2='+'+ar(15)+' نقطة'}
      else{r1='إجابة خاطئة';r2='راعيها:';dim=' dim'}
      if(ok)beep(880,.25,'triangle',.07);
      return {bg:'w',c:C,html:hdr(T,C)+`
<div class="res">
  <p class="r1">${r1}</p><p class="r2${dim}">${r2}</p>
  <div class="ring pav" data-ph="${esc(owner)}"><b>${esc(nm(owner).charAt(0))}</b></div>
  <p class="rn">${esc(who(owner))}</p>
  ${host?okBtn('storyNext','التالي','col1'):`<p class="st">التالي بعد قليل...</p>`}
</div>`};
    }
    /* end */
    const sc=GAMES.story.scores(g);
    return boardView(T,C,sc,g,'story');
  }
};

const PHRASES=[
  'تفتح الثلاجة وتنسى وش كنت تبي','تحاول تدخل سيارة وتكتشف إنها مو سيارتك','تتصل على واحد وجواله يرن بجنبك',
  'تتفاجأ بالفاتورة وتحاول تخفي الصدمة','تدور شاحنك بكل مكان وهو بيدك','تركض عشان تلحق المصعد وهو يقفل',
  'تفتح علبة عصير وترش على نفسك','تدخل مكان مظلم وتدور مفتاح الكهربا','تمشي ورا أحد وتنتبه إنك تقلد مشيته',
  'تحاول تمسك ذبابة وهي تطير حولك','تنتظر قهوتك وتسمع اسم غيرك','تكتب رسالة طويلة وتمسحها قبل ما ترسلها',
  'تحاول تفتح باب مكتوب عليه اسحب وإنت تدفع','تسلّم على أحد وتكتشف إنك ما تعرفه','تطلع من الاستراحة وتنسى جوالك وترجع ركض'
];
GAMES.sentence={color:COL.green,title:'جملة وافهمها!',label:'جملة وافهمها',min:2,
  init:R0=>{const p=shuffle(presentPh(R0)),n=Math.min(4,Math.max(2,p.length));
    const order=[];for(let i=0;i<n;i++)order.push(p[i%p.length]);
    return {phase:'ready',i:0,n,order,phrases:shuffle(PHRASES).slice(0,n)}},
  nextRound(g,sec,none){
    const base={['g/res/r'+g.i]:{sec,none:none?1:0}};
    if(g.i+1<g.n)return nx(g,Object.assign(base,{'g/phase':'ready','g/i':g.i+1}));
    return nx(g,Object.assign(base,{'g/phase':'end'}));
  },
  host(R0,g){
    const t=now();
    if(g.phase==='ready'){
      if(!isOn(arr(g.order)[g.i])||t>g.t0+DUR.sentReady)return g.i+1<g.n?nx(g,{'g/phase':'ready','g/i':g.i+1,['g/res/r'+g.i]:{sec:0,none:1}}):nx(g,{'g/phase':'end',['g/res/r'+g.i]:{sec:0,none:1}});
    }else if(g.phase==='play'){

const okCards=R0=>Object.entries((R0&&R0.cards)||{}).filter(([id,c])=>c&&c.ok===1);
const pendCards=R0=>Object.entries((R0&&R0.cards)||{}).filter(([id,c])=>c&&c.ok!==1).sort((a,b)=>(a[1].at||0)-(b[1].at||0));

function pickCard(R0,g){
  const used=(g&&g.used)||{},cs=Object.entries(R0.cards||{}).filter(([id,c])=>c&&c.ok===1&&!used['c'+id]);

}

const teamIdx=(g,ph)=>arr(g.teams).findIndex(t=>arr(t).includes(ph));
const photosOf=g=>Object.entries(g.photos||{}).map(([id,p])=>Object.assign({id},p));
const MEDIA={};
function paintMedia(root){
  $$('[data-media]',root||app).forEach(el=>{
    if(el.dataset.done)return;
    const pid=el.dataset.media,g=ROOM&&ROOM.g,p=g&&g.photos&&g.photos[pid];if(!p)return;
    const put=src=>{
      if(!el.isConnected)return;el.dataset.done='1';
      const m=p.kind==='video'?document.createElement('video'):document.createElement('img');
      m.src=src;if(p.kind==='video'){m.muted=true;m.loop=true;m.autoplay=true;m.playsInline=true;m.setAttribute('playsinline','')}
      m.draggable=false;el.prepend(m);
    };
    if(p.url)return put(p.url);
    if(MEDIA[pid])return put(MEDIA[pid]);
    el.dataset.done='';
    if(!el.dataset.req){el.dataset.req='1';B.get('media/'+ROOMID+'/'+pid).then(d=>{if(d){MEDIA[pid]=d;el.dataset.done='';el.dataset.req='';paintMedia(el.parentNode)}}).catch(()=>{el.dataset.req=''})}
  });
}
function dotsHTML(n,c){c=c||2;if(n>=c&&c>=2)return '<span class="dots m"><i class="g"></i></span>';let h='';for(let k=0;k<c;k++)h+='<i'+(k<n?' class="g"':'')+'></i>';return '<span class="dots">'+h+'</span>'}
const OPS=R0=>Object.assign({time:120,count:2,theme:''},(R0&&R0.opts)||{});
const cntOf=g=>g.cnt||2, durOf=g=>g.dur||DUR.upload;

  init:R0=>{

  },
  host(R0,g){

    if(g.phase==='upload'){

      if(t>g.t0+durOf(g)||full||g.force){
        const withP=new Set(photos.map(p=>p.team));
        if(photos.length<1||(arr(g.teams).length<2))return nx(g,{'g/phase':'end','g/abort':true});

    ROOMS.forEach(r=>{if(r.players&&present(r).length===0&&now()-(r.createdAt||0)>10*60*1000){B.update({['rooms/'+r.id]:null,['media/'+r.id]:null}).catch(()=>{})}});
    refreshHome();

function startSession(){
  endSession();
  stopPres=B.presence(ME.phone);
  unsubs.push(B.offset(o=>{OFF=o||0}));
  unsubs.push(B.watch('users',v=>{
    USERS=v||{};
    const u=USERS[ME.phone];if(u){ME.name=u.name;ME.points=u.points||0}
    if(S.screen==='home')refreshHome();
    else if(curView&&S.screen==='room'){renderRoom()}
    paintAvatars();
  }));
  unsubs.push(B.watch('presence',v=>{
    PRES=v||{};
    if(S.screen==='home')refreshHome();
    else if(S.screen==='room')renderRoom();
  }));
  unsubs.push(B.watch('invites/'+ME.phone,v=>{INVS=v||{};showInvites()}));
  watchRoomsList();
  goHome();
  handleHash();
}
function endSession(){
  unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];
  if(stopPres){stopPres();stopPres=null}
  if(unsubRoom){unsubRoom();unsubRoom=null}
  if(unsubRooms){unsubRooms();unsubRooms=null}
  ROOMID=null;ROOM=null;ROOMS=[];INVS={};clearInvite();
}
function handleHash(){
  const m=/^#room-(\d{3})$/.exec(location.hash||'');
  if(m&&ME){const c=m[1];history.replaceState(null,'',location.pathname+location.search);joinByCode(c)}
}
window.addEventListener('hashchange',handleHash);

/* مؤقّت عام: عدّادات + منطق المضيف */
let hostSent='',hostSentAt=0;
setInterval(()=>{
  if(!ME)return;
  if(S.screen==='room'&&ROOM){
    if(curView&&curView.update&&ROOM.g&&curKey&&curKey!=='lobby')curView.update(ROOM,ROOM.g);
    const pc=$('#pc');if(pc)pc.textContent=ar(present(ROOM).length)+' يلعبون';
  }
  if(S.screen==='home')refreshHome();
  const Rm=ROOM;
  if(Rm&&Rm.g&&!finished(Rm.g)&&isHost(Rm)){
    const g=Rm.g,sig=g.gid+':'+g.p;
    if(hostSent===sig&&Date.now()-hostSentAt<4000)return;
    const patch=GAMES[g.type].host(Rm,g);
    if(patch){hostSent=sig;hostSentAt=Date.now();W(patch)}
  }
},250);

/* ===== البداية ===== */
(async function boot(){
  show('splash');
  try{B=await rtdbBackend()}catch(e){B=localBackend()}
  const cur=st.get('cur',null);
  try{
    const u=cur?await B.get('users/'+cur):null;
    if(u){ME={phone:cur,name:u.name,points:u.points||0};startSession()}
    else show('reg');
  }catch(e){show('reg')}
  if(B.mode==='local')toast('وضع تجريبي محلي: فايربيس غير متاح هنا');
})();
})();
</script>
